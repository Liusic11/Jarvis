<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 100 556 436" width="1112" height="872">
  <!-- JARVIS 全屋线稿平面图。坐标沿用原始户型图的像素位置，比例约 31.5mm/px -->
  <defs>
    <style>
      .room { fill: #f7f7f5; }
      .wet  { fill: #eef4f8; }
      .bal  { fill: #f1f6fa; }
      .wall { fill: none; stroke: #4a4a4a; stroke-width: 4; stroke-linecap: square; stroke-linejoin: miter; }
      .outer{ fill: none; stroke: #333333; stroke-width: 7; stroke-linejoin: miter; }
      .gap  { fill: none; stroke: #f7f7f5; stroke-width: 8; }
      .door { fill: none; stroke: #8a8a8a; stroke-width: 1.5; }
      .win  { fill: none; stroke: #7fb3dc; stroke-width: 4; stroke-linecap: butt; }
      .name { font-family: "PingFang SC","Microsoft YaHei",sans-serif; font-size: 13px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="60" y="100" width="556" height="436" fill="#ffffff"/>

  <!-- 房间 -->
  <rect class="room" x="118" y="133" width="97"  height="129"/>  <!-- 卧室 -->
  <rect class="wet"  x="215" y="133" width="83"  height="75"/>   <!-- 卫生间 -->
  <rect class="room" x="298" y="133" width="100" height="115"/>  <!-- 卧室 -->
  <rect class="room" x="398" y="133" width="112" height="115"/>  <!-- 卧室 -->
  <rect class="room" x="510" y="133" width="90"  height="115"/>  <!-- 厨房 -->
  <rect class="wet"  x="118" y="262" width="117" height="60"/>   <!-- 卫生间 -->
  <polygon class="room" points="215,208 298,208 298,248 333,248 333,290 235,290 235,262 215,262"/> <!-- 过道 -->
  <polygon class="room" points="235,290 333,290 333,432 118,432 118,322 235,322"/>                   <!-- 主卧 -->
  <polygon class="room" points="333,248 600,248 600,520 518,520 518,432 333,432"/>                   <!-- 客餐厅 + 入口走廊 -->
  <polygon class="bal"  points="77,405 118,405 118,432 248,432 248,485 77,485"/>                     <!-- 阳台 -->
  <rect class="bal"  x="328" y="432" width="190" height="53"/>                                     <!-- 阳台 -->

  <!-- 内墙 -->
  <path class="wall" d="M215,133 V262 M298,133 V248 M398,133 V248 M510,133 V248"/>
  <path class="wall" d="M215,208 H298 M298,248 H510 M510,248 H600"/>
  <path class="wall" d="M118,262 H235 V322 H118 M215,262 H235 M235,290 H333 M298,248 H333 V290"/>
  <path class="wall" d="M333,248 V432"/>

  <!-- 外墙 -->
  <path class="outer" d="M118,133 H600 V520 H518 V432 H118 Z"/>

  <!-- 门洞（先盖掉墙，再画门扇和弧线） -->
  <path class="gap" d="M222,208 H247 M300,222 V247 M482,248 H507 M522,248 H547 M235,272 V297 M262,290 H287 M545,520 H580"/>
  <path class="door" d="M247,208 V233 A25,25 0 0 1 222,208"/>
  <path class="door" d="M300,247 H325 A25,25 0 0 0 300,222"/>
  <path class="door" d="M482,248 V223 A25,25 0 0 1 507,248"/>
  <path class="door" d="M235,272 H210 A25,25 0 0 0 235,297"/>
  <path class="door" d="M262,290 V265 A25,25 0 0 1 287,290"/>
  <path class="door" d="M580,520 V495 A25,25 0 0 0 555,520"/>

  <!-- 阳台 -->
  <path class="wall" d="M77,405 H118 M77,405 V485 H248 V432"/>
  <path class="wall" d="M328,432 V485 H518"/>
  <path class="win" d="M135,432 H230 M345,432 H500"/>

  <!-- 窗 -->
  <path class="win" d="M140,133 H205 M318,133 H372 M425,133 H490 M530,133 H580"/>
  <path class="door" d="M140,122 H205 V133 M318,122 H372 V133 M425,122 H490 V133 M530,122 H580 V133"/>
  <path class="win" d="M118,345 V400 M600,345 V400"/>

  <!-- 房间名 -->
  <text class="name" x="166" y="150">卧室</text>
  <text class="name" x="256" y="152">卫生间</text>
  <text class="name" x="348" y="150">卧室</text>
  <text class="name" x="454" y="150">卧室</text>
  <text class="name" x="555" y="150">厨房</text>
  <text class="name" x="176" y="292">卫生间</text>
  <text class="name" x="225" y="342">主卧</text>
  <text class="name" x="455" y="272">客餐厅</text>
  <text class="name" x="162" y="460">阳台</text>
  <text class="name" x="423" y="460">阳台</text>
  <text class="name" x="559" y="452">玄关</text>
</svg>
