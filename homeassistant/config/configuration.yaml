# ─────────────────────────────────────────────────────────────
# Home Assistant 配置（JARVIS 虚拟家庭）
#
# 所有虚拟设备都定义在 packages/virtual_home.yaml 中（纯 YAML）。
# fresh clone 后只需启动容器即可重建完全一致的环境，
# 不需要在 HA UI 里手动创建任何实体。
#
# 注意：.storage/、home-assistant_v2.db 等运行时状态不会提交，
# 虚拟家庭的可复现性由 virtual_home.yaml 保证。
# ─────────────────────────────────────────────────────────────

default_config:

homeassistant:
  name: JARVIS Home
  # 经纬度、海拔等位置信息属于环境专属配置，
  # 不写死在这里；需要时在未提交的 secrets.yaml 中通过 !secret 引入。
  # packages 目录下的每个 .yaml 都会作为「包」合并进来。
  packages: !include_dir_named packages

# 侧边栏里的「全屋」面板：户型图 + 设备图标，定义在 dashboards/floorplan.yaml
lovelace:
  dashboards:
    lovelace-floorplan:
      mode: yaml
      filename: dashboards/floorplan.yaml
      title: 全屋
      icon: mdi:floor-plan
      show_in_sidebar: true

logger:
  default: info
  logs:
    homeassistant.core: warning
    homeassistant.components.template: warning
