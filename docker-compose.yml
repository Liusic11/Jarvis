# ─────────────────────────────────────────────────────────────
# JARVIS 本地基础设施
#
# 默认只起 Home Assistant —— JARVIS 本体在本机用 uvicorn 跑，
# 这样改代码能热重载、能断点调试。
#
# 有 NVIDIA 显卡的机器想顺带把 Ollama 也放容器里：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile full up -d
# ─────────────────────────────────────────────────────────────

services:
  homeassistant:
    container_name: jarvis-homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped

    ports:
      - "8123:8123"

    # 绑定挂载宿主机上的配置目录（HA 官方推荐做法）：
    #   - 容器直接读取 homeassistant/config/ 下的 configuration.yaml 与 packages/
    #   - 改 YAML 后 HA 可热重载，开发迭代最方便
    #   - 运行时状态（home-assistant_v2.db / .storage 等）也落在宿主机，
    #     这些已在 .gitignore 中排除，不会进版本库
    # 注意：Docker Desktop 需要已开启对该盘的文件共享（Settings → Resources → File Sharing）。
    volumes:
      - ./homeassistant/config:/config

    environment:
      # 只用 TZ 环境变量设置时区，不挂载 /etc/localtime（Windows 上不存在该路径）
      TZ: Asia/Shanghai

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8123/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      # HA 首次启动较慢，给足引导时间
      start_period: 180s

  # 仅在使用 --profile full 时启动。
  # 更推荐的做法是在宿主机原生安装 Ollama（见 README），容器版作为备选。
  ollama:
    profiles: ["full"]
    container_name: jarvis-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      TZ: Asia/Shanghai

volumes:
  # Ollama 模型数据用 named volume（容器内路径，无法绑定挂载到 Windows）。
  # HA 配置目录改用上面 ./homeassistant/config 绑定挂载，便于开发迭代。
  ollama-models:
    name: jarvis-ollama-models
